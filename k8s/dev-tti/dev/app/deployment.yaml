apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp-com-app
  namespace: dev-tti
  labels:
    app.kubernetes.io/name: nodeapp-com-app
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeapp-com-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "true"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
      labels:
        app.kubernetes.io/name: nodeapp-com-app
        app.kubernetes.io/managed-by: deepagent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nodeapp-com-app
          image: 411232894985.dkr.ecr.us-east-1.amazonaws.com/nodeapp.com:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # WARNING: no /health-style route was detected on this service, so
          # probes are TCP-only. A TCP-only probe passes as soon as the socket
          # accepts, even if the app returns 500 to every request. Add a
          # /health endpoint returning 200 and set probePath in deepagent.yaml
          # to upgrade these probes to httpGet.
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: writable-tmp
              mountPath: /tmp
            - name: writable-app-logs
              mountPath: /app/logs
            - name: db-ca-bundle
              mountPath: /etc/deepagent/db-ca
              readOnly: true
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-cache
                optional: true
            - secretRef:
                name: app-queue
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-app
                optional: true
          env:
            - name: PORT
              value: "3000"
            - name: FRONTEND_URL
              value: http://frontend.dev-tti.svc.cluster.local
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/deepagent/db-ca/ca-bundle.pem
      volumes:
        - name: writable-tmp
          emptyDir: {}
        - name: writable-app-logs
          emptyDir: {}
        - name: db-ca-bundle
          configMap:
            name: db-ca-bundle
            optional: true
